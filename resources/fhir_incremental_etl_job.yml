resources:
  jobs:
    FHIR_Incremental_ETL_Pipeline:
      name: FHIR Incremental ETL Pipeline
      tasks:
        - task_key: Ingestion
          notebook_task:
            notebook_path: Notebooks/01_Ingestion_raw
            source: GIT
        - task_key: Bronze
          depends_on:
            - task_key: Ingestion
          notebook_task:
            notebook_path: Notebooks/02_Bronze
            source: GIT
        - task_key: Silver
          depends_on:
            - task_key: Bronze
          notebook_task:
            notebook_path: Notebooks/03_Silver
            source: GIT
        - task_key: Gold
          depends_on:
            - task_key: Silver
          notebook_task:
            notebook_path: Notebooks/04_Gold
            source: GIT
      git_source:
        git_url: https://github.com/cddharth/fhir-incremental-etl-databricks.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
